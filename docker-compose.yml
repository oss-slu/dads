services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dads
      POSTGRES_PASSWORD: dads
      POSTGRES_DB: dads
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/dads_prod_backup.sql:/docker-entrypoint-initdb.d/dads_prod_backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dads -d dads"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
