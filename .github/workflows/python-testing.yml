# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Backend Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # sign the SBOM attestation with GitHub's OIDC token (no secrets)
      attestations: write       # store the attestation
      artifact-metadata: write  # link the attestation to this repository

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dads
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        


    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10 with caching
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        cache-dependency-path: |
          Backend/requirements.txt
          requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest coverage
      
    - name: Lint with flake8 (strict mode)
      working-directory: Backend
      run: |
        # Fail fast on syntax errors & undefined names
        flake8 . --select=E9,F63,F7,F82 --show-source --statistics
        # Style linting: report only, does not fail the build
        flake8 . --max-complexity=10 --max-line-length=127 --statistics --exit-zero

    - name: Run tests with coverage
      env:
        PYTHONPATH: ${{ github.workspace }}/Backend
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dads
      run: |
        coverage run --source=Backend -m pytest tests/ -v
        coverage xml

    - name: Upload coverage report 
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    # Syft finds no packages in Backend/ (its requirements.txt is empty) or in the
    # root requirements.txt (no pinned versions). So install requirements.txt into
    # its own folder, at the versions the tests above used, and scan that folder.
    - name: Collect backend dependencies for the SBOM
      run: |
        pip freeze > "$RUNNER_TEMP/tested-versions.txt"
        pip install --target "$RUNNER_TEMP/dads-backend" -r requirements.txt -c "$RUNNER_TEMP/tested-versions.txt"

    - name: Generate backend SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      env:
        SYFT_SOURCE_NAME: dads-backend
        SYFT_SOURCE_VERSION: ${{ github.sha }}
      with:
        path: ${{ runner.temp }}/dads-backend
        format: spdx-json
        output-file: Backend/dads-backend-sbom.spdx.json
        upload-artifact: false

    - name: Upload backend SBOM
      uses: actions/upload-artifact@v7
      with:
        name: dads-backend-sbom
        path: Backend/dads-backend-sbom.spdx.json
        if-no-files-found: error

    - name: Attest backend SBOM
      if: github.ref == 'refs/heads/main'
      uses: actions/attest@v4
      with:
        subject-path: Backend/dads-backend-sbom.spdx.json

    - name: Verify backend SBOM attestation
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh attestation verify Backend/dads-backend-sbom.spdx.json --repo "$GITHUB_REPOSITORY" \
          --format json \
          --jq '.[].verificationResult.signature.certificate | "Verified: built by \(.buildSignerURI) from commit \(.sourceRepositoryDigest)"'
